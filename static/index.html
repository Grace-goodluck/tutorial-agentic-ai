<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 42rem;
         margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.5rem; }
  #log { border: 1px solid #ccc; border-radius: 6px; padding: 1rem;
         height: 24rem; overflow-y: auto; margin-bottom: 1rem; }
  .msg { margin-bottom: 0.75rem; }
  .user { color: #14532d; }
  .agent { color: #1e3a5f; }
  .error { color: #991b1b; }
  form { display: flex; gap: 0.5rem; }
  input { flex: 1; padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>

<h1>Agentic AI</h1>
<p>An agent with access to time, arithmetic, and live weather.</p>

<div id="log"></div>

<form id="form">
  <input id="input" placeholder="Ask something…" autocomplete="off" required>
  <button type="submit">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function add(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  add("You: " + message, "user");
  input.value = "";
  input.disabled = true;

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || "Request failed");
    add("Agent: " + data.reply, "agent");
  } catch (err) {
    add("Error: " + err.message, "error");
  } finally {
    input.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
